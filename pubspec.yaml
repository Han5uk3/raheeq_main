name: raheeq_main
description: "A new Flutter project."
publish_to: 'none'
version: 1.1.1+52

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  connectivity_plus: ^7.0.0
  internet_connection_checker_plus: ^2.7.2
  country_picker: ^2.0.27
  font_awesome_flutter: ^11.0.0
  cached_network_image: ^3.4.1
  firebase_core: ^4.9.0
  dio: ^5.9.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  material_symbols_icons: ^4.2928.1
  google_maps_flutter: ^2.17.1
  image_picker: ^1.2.2
  flutter_paytabs_bridge: ^2.7.13
  package_info_plus: ^8.0.0
  lottie: ^3.3.3
  collection: ^1.19.1
  permission_handler: ^12.0.3
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^22.0.0
  freshchat_sdk: ^0.10.34
  flutter_dotenv: ^6.0.1
  shimmer: ^3.0.0
  phone_numbers_parser: ^9.0.23
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  device_info_plus: ^12.4.0
  google_fonts: ^8.1.0
  video_player: ^2.11.1
  url_launcher: ^6.3.2
  pinput: ^6.0.2
  geolocator: ^14.0.2
  app_links: ^7.0.0
  smart_auth: ^3.2.0
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  share_plus: ^11.0.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/static_banners/
    - assets/app_logo/
    - assets/payment_method_icons/
    - assets/login/
    - assets/others/
    - assets/splash/

  fonts:
    - family: SFProText
      fonts:
        - asset: assets/fonts/SF-Pro-Text-Regular.otf
        - asset: assets/fonts/SF-Pro-Text-Medium.otf
          weight: 500
        - asset: assets/fonts/SF-Pro-Text-Bold.otf
          weight: 700
    - family: SaudiRiyal
      fonts:
        - asset: assets/fonts/saudi_riyal.ttf
    # The app renders entirely at w700, so only the bold faces are bundled.
    #
    # One face per family, deliberately: a family holding a single face renders
    # every requested FontWeight with that face, which is what stops the inline
    # w500/w600 styles scattered through the app from opting out. Adding the
    # regular faces back into these same families would undo that — a w500 style
    # would then resolve to the regular face and stop being bold.
    - family: ManropeBold
      fonts:
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
    # Manrope has no Arabic glyphs, so Arabic needs its own bundled face; left
    # to the OS fallback it had no bold face available and could never bolden.
    - family: NotoNaskhArabicBold
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
